name: Security check

on:
  workflow_call:

jobs:
  sast:
    name: SAST Security Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit SAST scan
        run: |
          bandit -r . -x ./.venv,./test-api.py -v | tee sast-report.txt

      - name: Publish SAST Log to GitHub Summary
        if: failure()
        run: |
          echo "## ❌ Falha na Verificação SAST (Bandit)" >> $GITHUB_STEP_SUMMARY
          echo "Foram detectadas vulnerabilidades de segurança no código. A execução da pipeline foi interrompida." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f sast-report.txt ]; then
            cat sast-report.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "Relatório SAST não foi gerado." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload SAST Report Artifact
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sast-report
          path: sast-report.txt
          if-no-files-found: ignore