name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  # pull_request:
  #   branches: [ "master" ]
  workflow_dispatch:
    branches: [ "master" ]

jobs:
  sast:
    name: SAST Security Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit SAST scan
        run: |
          bandit -r . -x ./.venv,./test-api.py -v | tee sast-report.txt

      - name: Publish SAST Log to GitHub Summary
        if: failure()
        run: |
          echo "## ❌ Falha na Verificação SAST (Bandit)" >> $GITHUB_STEP_SUMMARY
          echo "Foram detectadas vulnerabilidades de segurança no código. A execução da pipeline foi interrompida." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f sast-report.txt ]; then
            cat sast-report.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "Relatório SAST não foi gerado." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload SAST Report Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: sast-report.txt
          if-no-files-found: ignore

  test:
    name: Run Unit Tests
    needs: sast
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run tests
        run: |
          python test-api.py

  deploy:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker build
        run: |
          echo "Deploying application..."
          docker build -t douglasbueno/api-flask:latest .
      
      - name: Docker push
        run: |
          docker push douglasbueno/api-flask:latest
